name: Alfred preview

on:
  push:
    branches: [feature/alfred-control-centre-20261108]
    paths:
      - 'alfred/**'
      - '.github/workflows/alfred-preview.yml'

permissions:
  contents: read

concurrency:
  group: alfred-cloudflare-preview
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository == 'Mancave-Industries/Gameshed'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: Alfred-preview
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Install Wrangler
        run: npm install --prefix "$RUNNER_TEMP/alfred-cli" --no-audit --no-fund wrangler@4.158.0
      - name: Publish the isolated review deployment
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 34c51add54418c2a9d8c38b9be2420e8
          WRANGLER_SEND_METRICS: 'false'
        run: node alfred/deploy-preview.mjs "$RUNNER_TEMP/alfred-cli/node_modules/.bin/wrangler"
