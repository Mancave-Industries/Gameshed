name: Alfred preview

# Manual only. Pushes, pull requests and merges never deploy Alfred.
# To publish the review deployment, open Actions → Alfred preview → Run workflow,
# choose the branch to publish and type DEPLOY PREVIEW to confirm.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type DEPLOY PREVIEW to publish this branch to the Alfred review deployment'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: alfred-cloudflare-preview
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository == 'Mancave-Industries/Gameshed' && github.event_name == 'workflow_dispatch' && inputs.confirm == 'DEPLOY PREVIEW'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: Alfred-preview
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Install Wrangler
        run: npm install --prefix "$RUNNER_TEMP/alfred-cli" --no-audit --no-fund wrangler@4.158.0
      - name: Publish the isolated review deployment
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 34c51add54418c2a9d8c38b9be2420e8
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          WRANGLER_SEND_METRICS: 'false'
        run: node alfred/deploy-preview.mjs "$RUNNER_TEMP/alfred-cli/node_modules/.bin/wrangler"
