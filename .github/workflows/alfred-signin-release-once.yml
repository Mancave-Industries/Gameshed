name: Verify and publish approved Alfred sign-in fix once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/alfred-signin-release-once.yml'

permissions:
  contents: read

concurrency:
  group: alfred-cloudflare-preview
  cancel-in-progress: false

jobs:
  verify:
    if: github.repository == 'Mancave-Industries/Gameshed' && github.event.head_commit.message == 'Verify and publish approved Alfred sign-in fix once'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: 7f3f3c1a125c48ae2d8b2563ed45b75f24876a7f
          persist-credentials: false
      - name: Verify reviewed revision
        run: test "$(git rev-parse HEAD)" = "7f3f3c1a125c48ae2d8b2563ed45b75f24876a7f"
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install test browser outside the source tree
        run: |
          npm install --prefix "$RUNNER_TEMP/alfred-browser" --no-audit --no-fund playwright@1.62.1
          "$RUNNER_TEMP/alfred-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Full Alfred checks
        env:
          ALFRED_REQUIRE_DOCKER: '1'
          NODE_PATH: ${{ runner.temp }}/alfred-browser/node_modules
        run: node --test --test-concurrency=1 alfred/test/*.test.mjs
  deploy:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: Alfred-preview
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: 7f3f3c1a125c48ae2d8b2563ed45b75f24876a7f
          persist-credentials: false
      - name: Verify reviewed revision
        run: test "$(git rev-parse HEAD)" = "7f3f3c1a125c48ae2d8b2563ed45b75f24876a7f"
      - name: Install Wrangler
        run: npm install --prefix "$RUNNER_TEMP/alfred-cli" --no-audit --no-fund wrangler@4.158.0
      - name: Publish the isolated review deployment and pin its runner
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 34c51add54418c2a9d8c38b9be2420e8
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ALFRED_EXECUTOR_SHA: 7f3f3c1a125c48ae2d8b2563ed45b75f24876a7f
          ALFRED_EXECUTOR_REF: refs/heads/main
          WRANGLER_SEND_METRICS: 'false'
        run: node alfred/deploy-preview.mjs "$RUNNER_TEMP/alfred-cli/node_modules/.bin/wrangler"
