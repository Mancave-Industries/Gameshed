name: Publish tested Alfred focus fix once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/alfred-focus-publish-once.yml'

permissions:
  contents: read

concurrency:
  group: alfred-cloudflare-preview
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository == 'Mancave-Industries/Gameshed' && github.event.head_commit.message == 'Publish tested Alfred focus fix once'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: Alfred-preview
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: fcd7888ee8b932a722bf81ae17e7032420167b8d
          persist-credentials: false
      - name: Verify reviewed revision
        run: test "$(git rev-parse HEAD)" = "fcd7888ee8b932a722bf81ae17e7032420167b8d"
      - name: Install Wrangler
        run: npm install --prefix "$RUNNER_TEMP/alfred-cli" --no-audit --no-fund wrangler@4.158.0
      - name: Publish the isolated review deployment
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 34c51add54418c2a9d8c38b9be2420e8
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          WRANGLER_SEND_METRICS: 'false'
        run: node alfred/deploy-preview.mjs "$RUNNER_TEMP/alfred-cli/node_modules/.bin/wrangler"
