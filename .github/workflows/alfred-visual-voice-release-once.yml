name: Verify and publish Alfred visual voice fix once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/alfred-visual-voice-release-once.yml'

permissions:
  contents: read

concurrency:
  group: alfred-cloudflare-preview
  cancel-in-progress: false

jobs:
  verify:
    if: github.repository == 'Mancave-Industries/Gameshed' && github.event.head_commit.message == 'Publish Alfred visual and voice fix once'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      target_sha: ${{ steps.target.outputs.sha }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 3
          persist-credentials: false
      - name: Select the cleaned reviewed revision
        id: target
        run: |
          git fetch origin +refs/heads/main:refs/remotes/origin/main --depth=4
          git checkout --detach origin/main
          test "$(git log -1 --format=%s)" = "Remove completed one-time Alfred visual and voice publisher"
          test "$(git rev-parse HEAD^{tree})" = "79de0459a50072db1447b2674aa93e2ca3a366b7"
          test ! -e .github/workflows/alfred-visual-voice-release-once.yml
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install test browser outside the source tree
        run: |
          npm install --prefix "$RUNNER_TEMP/alfred-browser" --no-audit --no-fund playwright@1.62.1
          "$RUNNER_TEMP/alfred-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Full Alfred checks
        env:
          ALFRED_REQUIRE_DOCKER: '1'
          NODE_PATH: ${{ runner.temp }}/alfred-browser/node_modules
        run: node --test --test-concurrency=1 alfred/test/*.test.mjs

  deploy:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: Alfred-preview
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ needs.verify.outputs.target_sha }}
          persist-credentials: false
      - name: Verify reviewed revision
        run: test "$(git rev-parse HEAD)" = "${{ needs.verify.outputs.target_sha }}"
      - name: Install Wrangler
        run: npm install --prefix "$RUNNER_TEMP/alfred-cli" --no-audit --no-fund wrangler@4.158.0
      - name: Publish the isolated review deployment and pin its runner
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 34c51add54418c2a9d8c38b9be2420e8
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ALFRED_EXECUTOR_SHA: ${{ needs.verify.outputs.target_sha }}
          ALFRED_EXECUTOR_REF: refs/heads/main
          WRANGLER_SEND_METRICS: 'false'
        run: node alfred/deploy-preview.mjs "$RUNNER_TEMP/alfred-cli/node_modules/.bin/wrangler"
