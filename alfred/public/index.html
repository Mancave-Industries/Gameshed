<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0e1421">
  <meta name="robots" content="noindex, nofollow">
  <title>Alfred Control Centre</title>
  <link rel="stylesheet" href="/styles.css">
  <script src="/app.js" defer></script>
</head>
<body class="workspace-page">
  <header class="topbar">
    <div class="identity">
      <span class="signal" aria-hidden="true"></span>
      <div>
        <h1>Alfred</h1>
        <p id="freshness" role="status">Connecting…</p>
      </div>
    </div>
    <div class="topbar-actions">
      <button id="refresh" class="icon-button" type="button" aria-label="Refresh" hidden>↻</button>
      <button id="open-more" class="icon-button" type="button" aria-haspopup="dialog" aria-label="History, projects and settings" hidden>☰</button>
    </div>
  </header>

  <section id="session-panel" class="session-panel" aria-label="Sign in">
    <p id="session-message" role="status">Checking your GitHub connection…</p>
    <form action="/auth/login" method="post" id="login" hidden>
      <button class="button primary" type="submit">Sign in with GitHub</button>
    </form>
    <button id="retry" class="button" type="button" hidden>Try again</button>
    <noscript><p>Turn on JavaScript to talk to Alfred.</p></noscript>
  </section>

  <main id="workspace" hidden>
    <section class="now" aria-labelledby="now-heading">
      <h2 id="now-heading">Happening now</h2>
      <ul id="now-list"></ul>
    </section>
    <ol id="thread" class="thread" aria-label="Conversation with Alfred"></ol>
  </main>

  <form id="composer" class="composer" hidden>
    <div class="suggestions" role="group" aria-label="Suggestions">
      <button type="button" class="chip" data-say="What's next?">What's next?</button>
      <button type="button" class="chip" data-say="What's happening?">What's happening?</button>
      <button type="button" class="chip" data-say="Show recent results">Recent results</button>
    </div>
    <div class="composer-row">
      <label for="say" class="visually-hidden">Message Alfred</label>
      <textarea id="say" rows="1" maxlength="800" placeholder="Talk to Alfred…" enterkeyhint="send" autocomplete="off"></textarea>
      <button id="send" class="send" type="submit" aria-label="Send">➤</button>
    </div>
  </form>

  <dialog id="more" aria-labelledby="more-heading">
    <div class="sheet">
      <div class="sheet-header">
        <h2 id="more-heading">History and projects</h2>
        <button id="close-more" class="icon-button" type="button" aria-label="Close">✕</button>
      </div>
      <section aria-labelledby="history-heading">
        <h3 id="history-heading">Workflow history</h3>
        <ul id="history-list" class="sheet-list"></ul>
      </section>
      <section aria-labelledby="projects-heading">
        <h3 id="projects-heading">Projects and earlier decisions</h3>
        <ul id="project-list" class="sheet-list"></ul>
      </section>
      <section aria-labelledby="claude-heading">
        <h3 id="claude-heading">Claude activity</h3>
        <p id="claude-status" class="muted"></p>
        <details id="claude-findings" hidden>
          <summary>Claude's findings</summary>
          <p id="claude-result" class="prewrap"></p>
        </details>
        <p><a href="/handoff">Open Claude handoff</a></p>
      </section>
      <form action="/auth/logout" method="post" class="sign-out">
        <button class="button" type="submit">Sign out</button>
      </form>
    </div>
  </dialog>
</body>
</html>
