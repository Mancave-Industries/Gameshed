<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0e1421">
  <meta name="robots" content="noindex, nofollow">
  <title>Alfred</title>
  <link rel="stylesheet" href="/styles.css">
  <script src="/app.js" defer></script>
</head>
<body class="workspace-page">
  <header class="topbar">
    <div>
      <h1>Alfred</h1>
      <p id="freshness" role="status">Connecting…</p>
    </div>
    <button id="refresh" class="quiet-button" type="button" hidden>Refresh</button>
  </header>

  <section id="session-panel" class="session-panel" aria-label="Sign in">
    <p id="session-message" role="status">Checking your GitHub connection…</p>
    <form action="/auth/login" method="post" id="login" hidden>
      <button class="button primary" type="submit">Sign in with GitHub</button>
    </form>
    <button id="retry" class="button" type="button" hidden>Try again</button>
    <noscript><p>Turn on JavaScript to use Alfred.</p></noscript>
  </section>

  <main id="workspace" hidden>
    <section class="home-section attention-section" aria-labelledby="needs-heading">
      <div class="section-heading">
        <h2 id="needs-heading">Needs you</h2>
        <span id="waiting-count" class="count"></span>
      </div>
      <div id="attention-card"></div>
    </section>

    <section class="home-section" aria-labelledby="doing-heading">
      <div class="section-heading">
        <h2 id="doing-heading">Doing now</h2>
        <span id="doing-count" class="count" aria-hidden="true"></span>
      </div>
      <div id="doing-card"></div>
    </section>

    <details id="later-section" class="drawer" hidden>
      <summary><span>Saved for later</span><span id="later-count" class="count"></span></summary>
      <ul id="later-list" class="drawer-list"></ul>
    </details>

    <details id="recent-section" class="drawer">
      <summary>
        <span>Activity and results</span>
        <span id="recent-count" class="count"></span>
      </summary>
      <ul id="recent-list" class="drawer-list"></ul>
    </details>

    <details id="projects-section" class="drawer">
      <summary>
        <span>Projects</span>
        <span id="projects-count" class="count"></span>
      </summary>
      <ul id="project-list" class="drawer-list"></ul>
    </details>

    <button id="open-ask" class="ask-button" type="button">Ask Alfred</button>
    <p id="home-status" class="home-status" role="status"></p>
  </main>

  <dialog id="ask" aria-labelledby="ask-heading">
    <div class="sheet">
      <div class="sheet-header">
        <div>
          <p class="eyebrow">Conversation</p>
          <h2 id="ask-heading">Ask Alfred</h2>
        </div>
        <button id="close-ask" class="icon-button" type="button" aria-label="Close">✕</button>
      </div>
      <ol id="thread" class="thread" aria-label="Conversation with Alfred"></ol>
      <div class="suggestions" role="group" aria-label="Suggestions">
        <button type="button" class="chip" data-say="What's next?">What’s next?</button>
        <button type="button" class="chip" data-say="What's happening?">What’s happening?</button>
        <button type="button" class="chip" data-say="Show recent results">Recent results</button>
      </div>
      <form id="composer" class="composer">
        <label for="say" class="visually-hidden">Message Alfred</label>
        <textarea id="say" rows="1" maxlength="800" placeholder="Ask a question…" enterkeyhint="send" autocomplete="off"></textarea>
        <button id="send" class="send" type="submit">Send</button>
      </form>
      <form action="/auth/logout" method="post" class="sign-out">
        <button class="quiet-button" type="submit">Sign out</button>
      </form>
    </div>
  </dialog>
</body>
</html>
